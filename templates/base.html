<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Журнал ключей{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="top"><div class="top-inner">
    <a class="brand" href="{{ url_for('index') }}"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M16 7l3 3M14 9l2 2"/></svg></span>Журнал ключей</a>
    <nav>
      {% if user.is_admin %}
        <a href="{{ url_for('key_edit') }}">+ Ключ</a>
        <a href="{{ url_for('cabinet_edit') }}">+ Шкаф</a>
        <a href="{{ url_for('import_keys') }}">Импорт</a>
      {% endif %}
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="link" title="Выйти">Выйти · {{ user.username }}</button>
      </form>
    </nav>
  </div></header>
  {% endif %}
  <main>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
